  <text x="390" y="133" font-family="monospace" font-size="8" fill="#00ccaa" text-anchor="middle" letter-spacing="1">ALICE V0</text>
  <rect x="440" y="120" width="100" height="18" rx="3" fill="#ff336615" stroke="#ff336630" stroke-width="0.5"/>
  <text x="490" y="133" font-family="monospace" font-size="8" fill="#ff3366" text-anchor="middle" letter-spacing="1">ZERO TELEMETRY</text>
